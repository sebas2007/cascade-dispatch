name: Build world tiles
# Downloads OpenStreetMap data for the region, cuts it into game tiles, and commits them to world/
on:
  workflow_dispatch:
    inputs:
      region:
        description: Geofabrik extract (path after download.geofabrik.de/)
        default: us/new-york
      bbox:
        description: "Area to keep: west,south,east,north"
        default: "-74.10,40.55,-72.90,41.00"
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install osmium numpy mapbox-earcut
      - name: Download OpenStreetMap extract
        run: |
          R="${{ github.event.inputs.region }}"
          ID="${R##*/}"
          UA="Mozilla/5.0 (X11; Linux x86_64) CascadeDispatch-tiler"
          curl -sSL -A "$UA" -o index.json "https://download.geofabrik.de/index-v1-nogeom.json"
          echo "Index size: $(stat -c%s index.json) bytes"
          echo "== PBF links in the index that mention '$ID' =="
          grep -o "https://[^\"]*${ID}[^\"]*\.osm\.pbf" index.json | sort -u | tee found.txt
          URLS=()
          while read -r L; do URLS+=("$L"); done < <(grep -E "/${ID}-latest\.osm\.pbf$" found.txt)
          while read -r L; do URLS+=("$L"); done < <(grep -v -E "/${ID}-latest\.osm\.pbf$" found.txt)
          [ ${#URLS[@]} -eq 0 ] && { echo "No links found for $ID"; exit 1; }
          for U in "${URLS[@]}"; do
            echo "== Trying $U =="
            if curl -L --fail -A "$UA" -o region.osm.pbf "$U" && [ "$(stat -c%s region.osm.pbf)" -gt 5000000 ]; then
              echo "Downloaded OK"; ls -lh region.osm.pbf; exit 0
            fi
          done
          echo "All download sources failed"; exit 1
      - name: Cut out the play area
        run: osmium extract --bbox ${{ github.event.inputs.bbox }} --strategy smart -o area.osm.pbf region.osm.pbf
      - name: Make tiles
        run: |
          IFS=, read W S E N <<< "${{ github.event.inputs.bbox }}"
          rm -rf world && python3 tools/tile_osm.py world area.osm.pbf --bbox $S $W $N $E
          du -sh world; ls world | wc -l
      - name: Commit tiles
        run: |
          git config user.name "world-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A world
          git commit -m "Update world tiles" || echo "nothing to commit"
          git push
