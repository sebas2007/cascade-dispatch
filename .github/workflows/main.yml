name: Fetch OSM data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenStreetMap data
        run: |
          mkdir -p data
          for W in -73.44 -73.415; do
            for S in 40.71 40.73; do
              E=$(python3 -c "print(round($W+0.025,3))")
              N=$(python3 -c "print(round($S+0.02,3))")
              f="data/osm_${W}_${S}.osm"
              for try in 1 2 3; do
                if curl -sS -f -m 120 -A "cascade-dispatch/1.0" "https://api.openstreetmap.org/api/0.6/map?bbox=$W,$S,$E,$N" -o "$f"; then
                  echo "OK $f $(wc -c < $f) bytes"; break
                fi
                sleep 10
              done
            done
          done
          ls -l data
          ls data/*.osm
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Add OSM data for KFRG" || echo "nothing to commit"
          git push
