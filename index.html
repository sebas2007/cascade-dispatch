<style>
/* Layout: full-bleed 3D view; panels float over it. Dusk-blue glass, amber for instruments, magenta for guidance. */
:root{--bg:#0a1220;--panel:rgba(12,20,36,.88);--panel2:rgba(20,32,54,.9);--line:#2a3b57;--txt:#e8eef7;--dim:#8da0ba;--amber:#ffb23e;--cyan:#4fd6e8;--mag:#ff5ad0;--ok:#5fd68a;--bad:#ff6b5e;
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font:14px/1.45 var(--body);-webkit-tap-highlight-color:transparent;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
#gl.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
kbd{font:500 11px var(--mono);background:#1c2b45;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin:0 1px}
small{color:var(--dim)}
.ui{position:fixed;inset:0;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.ui>*{pointer-events:auto}

/* live pill */
#pill{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;background:rgba(6,10,18,.82);border:1px solid var(--line);padding:8px 12px;font:500 13px var(--mono);z-index:5}
#pill i{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
#pill b{font:700 20px var(--disp);letter-spacing:.04em}
#pill button{background:#1c2b45;border:1px solid var(--line);padding:4px 10px;margin-left:6px}
body.peek #menu{display:none}

/* menu */
#menu{position:fixed;top:0;right:0;bottom:0;width:min(1020px,100%);background:linear-gradient(90deg,rgba(8,13,24,0),rgba(8,13,24,.82) 12%,rgba(8,13,24,.92));display:flex;flex-direction:column;padding:max(64px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) 8%;gap:12px;z-index:4}
#mHead{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.brand{font:700 30px/1 var(--disp);letter-spacing:.08em}.brand b{color:var(--amber)}.brand small{display:block;font:500 12px var(--mono);letter-spacing:.04em;margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stats div{display:flex;flex-direction:column}.stats span{font:500 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}.stats b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.lics{display:flex;gap:5px;flex-wrap:wrap}.lic{font:600 11px var(--mono);padding:2px 7px;border:1px solid var(--line);color:var(--dim);letter-spacing:.06em}.lic.on{color:#0a1220;background:var(--amber);border-color:var(--amber)}

.t-lesson{background:#264a3a;color:#9fe3bd}.t-ferry{background:#44406a;color:#c7c2ff}.t-cargo{background:#4a3a1f;color:#ffd08a}.t-pax{background:#1f4452;color:#9fe4f5}.t-ifr{background:#5a2a40;color:#ffb0d4}
.route{font:700 26px/1 var(--disp);letter-spacing:.04em}.route i{font:500 12px var(--mono);color:var(--dim);margin:0 8px;font-style:normal;text-transform:uppercase}
.meta{font:400 12px var(--mono);color:var(--dim)}.pay{font:600 18px var(--mono);color:var(--amber)}.pay small{font-size:11px}
.lock{font-size:12px;color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px;padding:10px 0;position:sticky;bottom:0;background:linear-gradient(0deg,rgba(8,13,24,.96) 70%,rgba(8,13,24,0))}
.sub{color:var(--dim);font-size:13px}
.go{background:var(--amber);color:#1a1205;border:0;padding:10px 20px;font:700 18px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.go:disabled{background:#3b4658;color:#7a889e;cursor:not-allowed}

.btns button:not(.go):not(.ghost){background:#1c2b45;border:1px solid var(--line);padding:9px 14px;font:600 16px var(--disp);letter-spacing:.05em;text-transform:uppercase}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

.ac{margin-bottom:10px}.spec{font:400 12px var(--mono);color:var(--dim);margin:6px 0}.own{color:var(--ok);font:600 13px var(--mono)}
.tg{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;cursor:pointer}.tg input{margin-top:4px;width:18px;height:18px;accent-color:var(--amber)}.tg b{display:block}.tg small{display:block}
.seg{display:flex;align-items:center;gap:6px;margin:0 0 14px;flex-wrap:wrap}.seg span{font-weight:600;margin-right:6px}.seg button{background:#1c2b45;border:1px solid var(--line);padding:6px 14px;font:600 14px var(--disp);letter-spacing:.05em;text-transform:uppercase}.seg button.on{background:var(--amber);color:#1a1205;border-color:var(--amber)}
.keys{font-size:12.5px;color:#c4d0e2;line-height:2;margin-bottom:12px}

/* modal sheets */
.modal{position:fixed;inset:0;background:rgba(4,8,16,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:8;overflow:auto;touch-action:pan-y}
.sheet{background:var(--panel);border:1px solid var(--line);padding:22px;width:min(560px,100%);max-height:100%;overflow:auto}

.note{color:#ffd08a;font-size:13px}
.opts{display:grid;gap:8px;margin:14px 0}.opt{text-align:left;background:#16253f;border:1px solid var(--line);padding:12px 14px}.opt:hover:not(:disabled){border-color:var(--amber)}.opt.right{background:#1d4a32;border-color:var(--ok)}.opt.wrong{background:#512a2a;border-color:var(--bad)}
.big{font:700 64px/1 var(--disp)}.big small{font-size:24px}.big.ok{color:var(--ok)}.big.bad{color:var(--bad)}

.items{display:grid;gap:2px;margin-bottom:16px}.it{display:grid;grid-template-columns:1fr auto 54px;gap:10px;padding:4px 8px;background:rgba(255,255,255,.03);font-size:13px}.it em{font:400 11px var(--mono);color:var(--dim);font-style:normal}.it b{font:500 13px var(--mono);text-align:right}.it.full b{color:var(--ok)}.it.zero b{color:var(--bad)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.cl{display:grid;padding:4px}.cl button{background:none;border:0;text-align:left;padding:6px 8px;font:500 13px var(--mono);color:var(--dim)}.cl button.next{color:var(--amber);background:rgba(255,178,62,.1)}.cl button.done{color:var(--ok)}

/* HUD: slim top bar, one hint line, small instrument strip at the bottom */
#topbar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:5px 8px;font-family:var(--mono)}
#topbar .chip{background:var(--amber);color:#1a1205;font:700 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;white-space:nowrap}
#topbar #tRoute{font:700 18px var(--disp);letter-spacing:.06em;white-space:nowrap}#topbar #tWind{font:500 11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#topbar .grow{flex:1}
#topbar button{background:#1c2b45;border:1px solid var(--line);padding:3px 9px;font:600 13px var(--disp);letter-spacing:.05em;text-transform:uppercase}
#nextHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top,0px)) + 46px);display:flex;align-items:center;gap:10px;background:rgba(6,10,18,.8);border:1px solid var(--line);padding:5px 12px;font-size:13px;color:#e8eef7;max-width:min(560px,92vw)}
#wp{display:flex;align-items:center;gap:8px}#arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:20px solid var(--mag);transition:transform .15s}#wpd{font:600 12px var(--mono);color:var(--mag)}
#atc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 112px);width:min(520px,92vw);display:grid;gap:3px;pointer-events:none}
#atc .msg{background:rgba(6,10,18,.8);border-left:3px solid var(--cyan);padding:4px 9px;font:500 13px var(--mono)}#atc b{color:var(--cyan);font:600 11px var(--mono);margin-right:6px}
#side{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 90px);width:min(250px,44vw);display:grid;gap:6px}
#side>div,#side>button{background:rgba(6,10,18,.82);border:1px solid var(--line)}
#strip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom,0px));width:min(560px,96vw);display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr;grid-template-areas:"adi spd alt vs hdg" "adi misc misc misc misc";align-items:center;gap:2px 10px;background:var(--panel);border:1px solid var(--line);padding:6px 10px}
#strip #adi{grid-area:adi;width:64px;height:64px;border-radius:50%}
#strip .rd{display:flex;flex-direction:column;align-items:flex-start;line-height:1}#strip .rd span{font:500 10px var(--mono);color:var(--dim);letter-spacing:.1em}#strip .rd b{font:600 24px var(--mono);color:var(--amber);margin-top:2px}#strip .rd b.warn{color:var(--bad)}
#strip .rd:nth-of-type(1){grid-area:spd}#strip .rd:nth-of-type(2){grid-area:alt}#strip .rd:nth-of-type(3){grid-area:vs}#strip .rd:nth-of-type(4){grid-area:hdg}
#rMisc{grid-area:misc;font:500 11px var(--mono);color:var(--dim);white-space:pre-wrap}
#cfgBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 84px);display:flex;gap:4px;align-items:center;justify-content:center}
#cfgBar button{background:rgba(12,20,36,.88);border:1px solid var(--line);padding:4px 10px;font:600 12px var(--mono);min-width:34px}#cfgBar button.lit{border-color:var(--amber);color:var(--amber)}#cfgBar button.warn{border-color:var(--bad);color:var(--bad)}#cfgBar span{font:500 11px var(--mono);color:var(--dim);padding:0 4px;background:rgba(6,10,18,.7)}
#appr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:116px;height:116px}
.radio{padding:8px;font:700 16px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--amber)!important;color:#1a1205;border:0!important}
#apPanel{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-52%);width:min(330px,92vw);background:var(--panel);border:1px solid var(--cyan);padding:12px;display:grid;gap:8px}
.aph{display:flex;justify-content:space-between;align-items:center}.aph b{font:700 20px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}.state{font:600 12px var(--mono);color:var(--dim)}.state.on{color:var(--ok)}
.apr{display:grid;grid-template-columns:72px 62px 1fr;gap:6px;align-items:center}.apr span{font:500 11px var(--mono);color:var(--dim);text-transform:uppercase}.apr b{font:600 20px var(--mono);color:var(--cyan)}.apr div{display:flex;gap:3px}
#apPanel button{background:#16253f;border:1px solid var(--line);padding:5px 7px;font:500 12px var(--mono);flex:1}
.apb{display:flex;gap:6px;flex-wrap:wrap}.apb .go{padding:8px 12px;font-size:16px}.apn{margin:0;font-size:12px;color:var(--dim)}
@media (pointer:coarse){#cfgBar{bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 84px);transform:translateX(-50%) scale(1.05)}#strip .rd b{font-size:20px}#tWind{display:none}}
#touch{display:block;position:absolute;inset:auto 0 0 0;height:0}

#rud button{width:64px;height:48px;background:rgba(12,20,36,.88);border:2px solid rgba(255,255,255,.35);font-size:20px;touch-action:none}#rud button.on{background:var(--amber);color:#1a1205}#rud span{font:600 10px var(--mono);color:var(--dim);letter-spacing:.1em}

@media (pointer:coarse){#rud{left:calc(max(16px,env(safe-area-inset-left,0px)) + 135px)}#stick{display:block;position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 130px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none}

#pause .sheet{text-align:center}#pause .btns{justify-content:center}

</style>

'use strict';
/* ---- core.js ---- */
/* ===== Cascade Dispatch core: world data + flight model (pure JS, no DOM) ===== */
const DEG = Math.PI / 180, KT = 0.514444, FT = 0.3048, NM = 1852, GRAV = 9.80665;
/* Regions: the world is built once for one region. Changing region saves it and reloads the page. */
const REGIONS = {
  pnw: { id: 'pnw', name: 'Pacific Northwest', lat0: 47.45, lon0: -122.31, magvar: 15.5, start: 'KRNT' },

function airDensity(h) { const t = Math.max(0, 1 - 2.2558e-5 * Math.max(h, 0)); return 1.225 * Math.pow(t, 4.2559); }

function createAircraft(type, x, z, hdgTrue, payload, fuel) {
  const A = AC[type];
  const h = hdgTrue * DEG, f = [Math.sin(h), 0, -Math.cos(h)];
  const s = { ac: A, payload: payload || 0, fuel: fuel == null ? A.fuelCap : fuel, p: [x, 0, z], v: [0, 0, 0], f, u: [0, 1, 0], r: [-f[2], 0, f[0]],
    pr: 0, qr: 0, rr: 0, thr: 0, eng: false, flaps: 0, gear: 1, air: false, crashed: null, touch: null, hardness: 0, time: 0, spin: 0, gearHit: false };
  s.r = vnorm(cross(f, [0, 1, 0]));
  const m0 = mass(s);
  const xN = A.wheels[0][0], xM = A.wheels[1][0], c0 = 0.12;
  const Fn = m0 * GRAV * (-xM) / (xN - xM), Fm = (m0 * GRAV - Fn) / 2;
  s.wheels = A.wheels.map(w => {
    const F = w[3] ? Fn : Fm, k = F / c0;
    return { x: w[0], y: w[1], z: w[2], nose: !!w[3], k, c: 2 * 0.55 * Math.sqrt(k * F / GRAV) };
  });

  s.p[1] = surfH(x, z) - A.wheels[1][1] - c0;
  return s;
}
function mass(s) { return s.ac.empty + s.ac.crew + s.payload + s.fuel; }

function clOf(A, a, fl) {
  const f = A.dCLflap * fl, lim = A.as;
  if (a > lim) { const x = a - lim; return (A.CL0 + A.CLa * lim + f) * (1 - 0.6 * sstep(0, 0.15, x)); }
  if (a < -lim) { const x = -lim - a; return (A.CL0 - A.CLa * lim + f) * (1 - 0.6 * sstep(0, 0.15, x)); }
  return A.CL0 + A.CLa * a + f;
}

function attitude(s) {
  return { hdg: ((Math.atan2(s.f[0], -s.f[2]) / DEG) + 360) % 360, pitch: Math.asin(clamp(s.f[1], -1, 1)) / DEG,
    bank: Math.asin(clamp(-s.r[1], -1, 1)) / DEG, vs: s.v[1] / FT * 60,
    gs: Math.hypot(s.v[0], s.v[2]) / KT };
}
function iasOf(s, wind) {
  const va = [s.v[0] - (wind ? wind[0] : 0), s.v[1], s.v[2] - (wind ? wind[2] : 0)];
  return vlen(va) * Math.sqrt(airDensity(s.p[1]) / 1.225) / KT;
}

/* c = {pit, rol, yaw, thr, brk, flapCmd, gearCmd, trim}; env = {wind:[x,0,z]} */
function step(s, c, dt, env) {

  const wind = env.wind || [0, 0, 0];

  s.flaps += clamp(c.flapCmd - s.flaps, -0.5 * dt, 0.5 * dt);
  if (A.retract) s.gear += clamp((c.gearCmd ? 1 : 0) - s.gear, -dt / 6, dt / 6);
  const fN = s.flaps, m = mass(s), rho = airDensity(s.p[1]), dens = rho / 1.225;
  const f = s.f, up = s.u, right = s.r;
  const va = [s.v[0] - wind[0], s.v[1] - wind[1], s.v[2] - wind[2]];
  const V = vlen(va);
  let alpha = 0, beta = 0, F = [0, -m * GRAV, 0];
  if (V > 0.5) {
    const u = dot(va, f), w = dot(va, up), sv = dot(va, right);
    alpha = clamp(Math.atan2(-w, u), -1.4, 1.4); beta = Math.atan2(sv, Math.max(Math.hypot(u, w), 0.3));
    const vh = vmul(va, 1 / V), q = 0.5 * rho * V * V;
    const CL = clOf(A, alpha, fN);
    const ab = Math.abs(alpha);
    const CD = A.CD0 + A.k * CL * CL + A.cdFlap * fN + (A.retract ? 0.014 * s.gear : 0) + 1.2 * sstep(A.as, 0.9, ab) + 0.5 * beta * beta;
    let ld = cross(right, vh); const ll = vlen(ld); ld = ll > 0.05 ? vmul(ld, 1 / ll) : up;
    const Fa = vadd(vadd(vmul(ld, q * A.S * CL), vmul(vh, -q * A.S * CD)), vmul(right, -q * A.S * 0.6 * beta));
    F = vadd(F, Fa);
  }
  // thrust
  let T = 0;
  if (s.eng && s.fuel > 0) {
    const tf = s.thr;
    if (A.prop) T = tf * Math.min(A.Tstat * Math.pow(dens, 0.7), A.P * 0.8 * Math.pow(dens, 0.9) / Math.max(V, 6));
    else T = tf * A.Tmax * Math.pow(dens, 0.75) * Math.max(0.1, 1 - V / A.vT);

  let Fy = 0, tauF = 0, tauR = 0, noseC = false, mainC = false, maxC = 0;

  const vyBefore = s.v[1];

  const eff = clamp(V * V / (A.Vref * A.Vref), 0, 1.6);

  const aEq = A.a0 + (c.trim || 0) * 0.08 - (grounded ? 0.035 : 0);
  const stallPush = alpha > A.as ? (alpha - A.as) * 14 : 0;
  const kmE = A.ks * 0.30;

  s.pr += -beta * 0.8 * effR * dt;

  const ax = F[0] / m, ay = F[1] / m, az = F[2] / m;
  s.v[0] += ax * dt; s.v[1] += ay * dt; s.v[2] += az * dt;

    const gN = clamp(Fy / (m * GRAV), 0, 1.5);

      const Vg = Math.abs(vf), yr = c.yaw * A.steerRate * Math.min(1, Vg / 3) / (1 + Vg / 14) + c.yaw * 0.08 * (Vg < 3 ? 1 : 0) * (1 - Math.min(1, Vg / 3));

  const om = vadd(vadd(vmul(s.f, s.pr), vmul(s.r, s.qr)), vmul(s.u, -s.rr));
  const wl = vlen(om);

    const ax3 = vmul(om, 1 / wl), an = wl * dt;

  const pts = [[A.nose, 0, 0], [-A.tail, 0.2, 0], [-0.5, 0.3, A.span / 2], [-0.5, 0.3, -A.span / 2], [0, -0.95, 0]];
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i];

      if (sp < 2) s.crashed = null;
    }
  }
  if (s.crashed) s.v = [0, 0, 0];
}

function drawExam(licId, seed) {
  const L = LICENSES[licId], rank = L.rank;
  const pool = QUESTIONS.filter(q => q.r <= Math.max(1, rank)).map(q => ({ q, k: Math.sin(seed * 12.9898 + q.q.length * 78.233) }));
  pool.sort((a, b) => a.k - b.k);
  return pool.slice(0, L.exam).map(x => {
    const order = x.q.o.map((t, i) => ({ t, i })).sort((a, b) => Math.sin(seed * 3.1 + a.i * 5.7 + x.q.a) - Math.sin(seed * 3.1 + b.i * 5.7 + x.q.a));
    return { q: x.q.q, o: order.map(z => z.t), a: order.findIndex(z => z.i === x.q.a) };
  });
}
